name: Deploy to Aliyun OSS

on:
  push:
    branches:
      - dev # 或者你的主分支名

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ossutil
        run: |
          wget http://gosspublic.alicdn.com/ossutil/1.7.14/ossutil64
          chmod +x ossutil64
          mv ossutil64 /usr/local/bin/ossutil
          ossutil config -e oss-cn-shanghai.aliyuncs.com -i ${{ secrets.OSS_ACCESS_KEY_ID }} -k ${{ secrets.OSS_ACCESS_KEY_SECRET }} -L CH -c ~/.ossutilconfig
      - name: Deploy to Aliyun OSS
        run: ossutil cp -rf ./ oss://orcalab-docs/