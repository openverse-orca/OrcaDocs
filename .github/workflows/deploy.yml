name: Deploy to Aliyun OSS

on:
  push:
    branches:
      - dev # 或者你的主分支名

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ossutil
        run: |
          # 关键命令1：打开“错误时立即退出”模式。任何命令失败（返回非0状态码），整个脚本就停止，不会继续执行错误的后续步骤。
          set -e

          echo "正在下载ossutil..."
          # 关键命令2：下载文件。如果wget失败，则执行 `||` 后面的命令：打印错误信息并退出（状态码1表示失败）。
          wget -q https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil64 || { echo "下载ossutil失败"; exit 1; }

          # 赋予执行权限
          chmod +x ossutil64
          # 将文件移动到系统目录并重命名
          sudo mv ossutil64 /usr/local/bin/ossutil

          echo "ossutil安装完成，版本信息："
          # 关键命令3：检查文件是否存在。如果上一步移动失败，这里会报错退出。
          ls -l /usr/local/bin/ossutil || { echo "ossutil未找到"; exit 1; }
          # 关键命令4：尝试运行命令。如果文件损坏或无执行权限，这里会报错退出。
          ossutil --version || { echo "ossutil执行失败"; exit 1; }
          
      - name: Configure ossutil
        run: |
          # 配置ossutil，如果OSS_ENDPOINT没有设置，使用默认值
          if [ -z "${{ secrets.OSS_ENDPOINT }}" ]; then
            ossutil config -e oss-cn-shanghai.aliyuncs.com -i ${{ secrets.OSS_ACCESS_KEY_ID }} -k ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          else
            ossutil config -e ${{ secrets.OSS_ENDPOINT }} -i ${{ secrets.OSS_ACCESS_KEY_ID }} -k ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          fi
          
      - name: Deploy to Aliyun OSS
        run: |
          # 同步文件到OSS，排除.git目录
          echo "开始同步文件到OSS..."
          echo "源目录：$(pwd)"
          echo "目标OSS：oss://orcalab-docs/"
          
          # 列出要上传的文件
          echo "将要上传的文件："
          find . -type f -name "*" | grep -v ".git" | head -20
          echo "..."
          
          # 执行同步
          ossutil cp -rf --exclude ".git/**" ./ oss://orcalab-docs/
          
          # 验证上传
          echo "上传完成，验证文件列表："
          ossutil ls oss://orcalab-docs/ | head -20
          echo "..."
          
          echo "部署完成！"